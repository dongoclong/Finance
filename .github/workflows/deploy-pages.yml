name: Deploy to GitHub Pages

# Deploys on every push to main.
#
# The repo must be Public — Pages on a private repo needs GitHub Pro. Beyond that
# the job is self-sufficient: configure-pages enables Pages itself if needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for Pages
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # `enablement: true` turns Pages on via the API if it is not already, so the
      # job no longer depends on someone having clicked the setting first — which is
      # exactly how run #1 failed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

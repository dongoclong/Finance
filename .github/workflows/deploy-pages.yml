name: Deploy to GitHub Pages

# Deploys on every push to main.
#
# Requires two things to be true on github.com, or the job fails with
# "Get Pages site failed":
#   1. The repo is Public  (Pages on a private repo needs GitHub Pro)
#   2. Settings → Pages → Source = "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for Pages
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
